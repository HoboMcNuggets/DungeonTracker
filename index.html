<!DOCTYPE html>
<html lang="fr" data-theme="alttp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old School Dungeon Drawer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/mapTheme.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="header__title" title="Glissez une pièce sur la grille — cliquez sur une salle pour l'éditer">
      <a href="https://twitch.tv/nevroze" class="header__title-link" target="_blank" rel="noopener noreferrer" title="Le vrai gamer">Nevroze</a> Old School vrai gamer dungeon drawer
    </h1>

    <form id="size-form" class="size-form" aria-label="Configuration de la grille">
      <div class="size-form__field">
        <label for="grid-width">Largeur</label>
        <input type="number" id="grid-width" name="width" min="1" max="20" value="10" required>
      </div>
      <div class="size-form__field">
        <label for="grid-height">Hauteur</label>
        <input type="number" id="grid-height" name="height" min="1" max="20" value="10" required>
      </div>
      <div class="size-form__field">
        <label for="map-theme">Palette</label>
        <select id="map-theme" name="map-theme" aria-label="Palette des salles">
          <option value="classic">Classique</option>
          <option value="nes">8-bit</option>
          <option value="alttp" selected>16-bit</option>
          <option value="oot32">32-bits</option>
        </select>
      </div>
      <button type="submit" class="btn btn--primary btn--compact">Appliquer</button>
      <button type="button" id="export-image-btn" class="btn btn--secondary btn--compact">
        Exporter en image
      </button>
    </form>

    <p id="size-message" class="size-message" role="status" aria-live="polite"></p>

    <nav class="map-tabs-bar" aria-label="Onglets de cartes">
      <div id="map-tabs-container" class="map-tabs"></div>
    </nav>

    <nav class="floor-tabs-bar" aria-label="Étages">
      <div id="floor-tabs-container" class="floor-tabs"></div>
    </nav>
  </header>

  <main class="main">
    <section id="grid-section" class="grid-section" aria-label="Grille du donjon">
      <div class="map-zoom-toolbar" aria-label="Zoom de la carte">
        <button
          type="button"
          id="map-zoom-out"
          class="map-zoom-toolbar__btn"
          aria-label="Dézoomer de 10 pour cent"
        >
          −
        </button>
        <span id="map-zoom-label" class="map-zoom-toolbar__label" aria-live="polite">100%</span>
        <button
          type="button"
          id="map-zoom-in"
          class="map-zoom-toolbar__btn"
          aria-label="Zoomer de 10 pour cent"
        >
          +
        </button>
      </div>
      <div id="floors-view" class="floors-view"></div>
    </section>

    <aside class="sidebar" aria-label="Pièces et édition">
      <section id="pieces-panel" class="sidebar-view" aria-label="Palette de pièces">
        <h2 class="sidebar__title">Pièces</h2>
        <p class="sidebar__hint">
          Glissez-déposez une pièce sur la grille. Une salle déjà placée peut être déplacée vers une case vide.
        </p>
        <div id="palette-container"></div>
      </section>

      <section id="edit-panel" class="sidebar-view sidebar-view--hidden" aria-label="Édition de salle" aria-hidden="true">
        <h2 class="sidebar__title">Éditer la salle</h2>
        <p id="edit-hint" class="sidebar__hint sidebar__hint--compact"></p>
        <div class="edit-markers">
          <p class="sidebar__hint sidebar__hint--small">Marqueurs :</p>
          <div class="marker-toggles" id="marker-toggles"></div>
          <div class="lock-field">
            <p class="sidebar__hint sidebar__hint--small">Portes verrouillées :</p>
            <div id="lock-toggles" class="door-side-toggles" role="group" aria-label="Portes verrouillées par côté"></div>
          </div>
          <div class="breakable-wall-field">
            <p class="sidebar__hint sidebar__hint--small">Porte brisable (bombe) :</p>
            <div id="breakable-wall-toggles" class="door-side-toggles" role="group" aria-label="Portes brisables par côté (bombe)"></div>
          </div>
          <div class="staircase-field">
            <p class="sidebar__hint sidebar__hint--small">Escaliers :</p>
            <div id="staircase-toggles" class="staircase-toggles" role="group" aria-label="Lettres d'escalier"></div>
          </div>
          <div class="entrance-field">
            <p class="sidebar__hint sidebar__hint--small">Entrée :</p>
            <div id="entrance-toggles" class="door-side-toggles" role="group" aria-label="Portes d'entrée par côté"></div>
          </div>
        </div>
        <div class="palette-actions palette-actions--top">
          <button type="button" id="delete-cell-btn" class="btn btn--danger">
            Supprimer la salle
          </button>
        </div>
        <p class="sidebar__hint sidebar__hint--small">Changer le type :</p>
        <div id="edit-preset-container"></div>
      </section>
    </aside>
  </main>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-message">
    <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
    <div class="confirm-dialog__actions">
      <button type="button" id="confirm-dialog-cancel" class="btn btn--secondary">Annuler</button>
      <button type="button" id="confirm-dialog-ok" class="btn btn--danger">Supprimer</button>
    </div>
  </dialog>

  <script src="js/roomPresets.js"></script>
  <script src="js/cellMarkers.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/mapTabs.js"></script>
  <script src="js/staircases.js"></script>
  <script src="js/dragDrop.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/mapZoom.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/imageExport.js"></script>
  <script src="js/confirmDialog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
